{% load static ui %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>登录 · 栖木 ERP</title><link rel="icon" href="{% static 'erp/mark.svg' %}"><script src="{% static 'erp/preferences.js' %}"></script><link rel="stylesheet" href="{% static 'vendor/tabler.min.css' %}"><link rel="stylesheet" href="{% static 'erp/app.css' %}"></head><body class="login-body"><main class="login-layout"><section class="login-story"><a class="brand" href="{% url 'login' %}"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-name">栖木<span>FURNITURE ERP</span></span></a><div class="login-story-copy"><div class="eyebrow">为每一个理想的家</div><h1>经营有序。<br>美好发生。</h1><p>从第一份设计，到最后一毫米。<br>连接家居经营的每一个细节。</p></div><div class="cabinet-art" aria-hidden="true"><div class="art-wall"></div><div class="art-shelf"><i></i><i></i><i></i></div><div class="art-cabinet"><i></i><i></i><i></i></div><div class="art-floor"></div></div><span class="login-caption">客户 · 设计 · 生产 · 交付</span></section><section class="login-form-area"><div class="login-card"><span class="login-kicker">WELCOME BACK</span><h2>欢迎回来。</h2><p>登录你的工作空间，让协作更从容。</p><form method="post">{% csrf_token %}{% if form.errors %}<div class="form-error-summary" role="alert">账号或密码不正确，请检查后重试。</div>{% endif %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<div class="form-field"><label for="id_username">账号</label><input class="form-control" type="text" name="username" id="id_username" required autofocus autocomplete="username" value="{{ form.username.value|default:'' }}"></div><div class="form-field"><label for="id_password">密码</label><input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div><button type="submit" class="btn btn-primary login-submit">进入工作空间 {% icon 'arrow' %}</button></form><p class="login-help">账号由企业管理员分配。演示环境账号见初始化命令输出。</p></div><footer>栖木家居 ERP · 更专注，更从容。</footer></section></main></body></html>
