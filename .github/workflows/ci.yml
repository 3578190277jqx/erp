name: ERP quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --verbosity 2
      - name: Production settings check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-ephemeral-key-with-at-least-50-characters-do-not-use-in-production
          DJANGO_ALLOWED_HOSTS: erp.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://erp.example.com
        run: python manage.py check --deploy --fail-level WARNING
