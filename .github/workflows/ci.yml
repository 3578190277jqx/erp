name: ERP quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci-only-local-service
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: erp_ci
      POSTGRES_USER: erp_ci
      POSTGRES_PASSWORD: ci-only-local-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-postgres.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --verbosity 2
      - name: Production settings check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-ephemeral-key-with-at-least-50-characters-do-not-use-in-production
          DJANGO_ALLOWED_HOSTS: erp.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://erp.example.com
        run: python manage.py check --deploy --fail-level WARNING
